name: Build Android APK

# Builds the APK on GitHub's own Linux servers, since Buildozer (the tool
# that packages this into an .apk) does not run on Windows. Push to `main`
# or trigger manually, then download the APK from this run's "Artifacts".
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev \
            libltdl-dev build-essential

      - name: Install buildozer + cython
        run: |
          pip install --upgrade pip
          pip install buildozer "cython<3.0"

      - name: Cache Buildozer global directory (Android SDK/NDK downloads)
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-global-

      - name: Cache Buildozer project build directory
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-local-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-local-

      - name: Build debug APK
        run: |
          yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: quote-of-the-day-apk
          path: bin/*.apk
          if-no-files-found: error
